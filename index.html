<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#123A2F">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        :root {
            --ink: #123A2F;
            --ink-soft: #1E5443;
            --paper: #EFF2EC;
            --sheet: #FBFCFA;
            --text: #1B2420;
            --muted: #566359;
            --line: #D3DAD0;
            --wheat: #C4912A;
            --wheat-text: #86610F;
            --wheat-wash: #F5ECD4;
            --on-ink: #F3F1E6;
            --serif: 'Noto Serif KR', 'Nanum Myeongjo', serif;
            --sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        body {
            margin: 0; font-family: var(--sans); font-size: 17px; line-height: 1.7;
            color: var(--text); background: var(--paper); letter-spacing: -0.01em; word-break: keep-all;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: calc(48px + env(safe-area-inset-bottom));
        }
        h1, h2, h3, p, ol, ul { margin: 0; padding: 0; }
        ol, ul { list-style: none; }
        button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
        a { color: inherit; text-decoration: none; }
        :focus-visible { outline: 3px solid var(--wheat); outline-offset: 2px; border-radius: 6px; }
        .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

        /* ---------- 헤더 ---------- */
        .hero { background: var(--ink); color: var(--on-ink); padding: 36px 0 32px; }
        .hero .church { font-size: .9rem; color: rgba(243,241,230,.75); }
        .hero h1 { font-family: var(--serif); font-weight: 800; font-size: 2.1rem; line-height: 1.3; letter-spacing: -0.02em; margin-top: 4px; }

        .notice { margin-top: 20px; padding: 14px 16px; border-left: 5px solid var(--wheat); background: var(--wheat-wash); border-radius: 4px 12px 12px 4px; font-size: .95rem; font-weight: 600; }

        /* ---------- 검색 ---------- */
        .tools { display: flex; gap: 10px; margin: 20px 0 8px; }
        .search {
            flex: 1; min-width: 0; min-height: 48px; padding: 0 16px; border-radius: 12px;
            border: 1px solid var(--line); background: var(--sheet); font: inherit; color: var(--text);
        }
        .search::placeholder { color: var(--muted); }
        .search:focus { outline: 3px solid var(--wheat); outline-offset: 0; border-color: transparent; }
        .btn {
            min-height: 48px; padding: 0 18px; border-radius: 12px; background: var(--ink); color: var(--on-ink);
            font-weight: 700; font-size: .92rem; white-space: nowrap; transition: background .2s;
        }
        .btn:hover { background: var(--ink-soft); }
        .btn:active { transform: scale(.97); }
        .btn.quiet { background: var(--sheet); color: var(--text); border: 1px solid var(--line); }
        .btn.quiet:hover { border-color: var(--ink-soft); background: var(--sheet); }

        .result-note { margin: 16px 0 4px; color: var(--muted); font-size: .92rem; }
        .empty { margin-top: 32px; padding: 28px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }

        /* ---------- 이번 주 ---------- */
        .now { margin-top: 28px; background: var(--ink); color: var(--on-ink); border-radius: 20px; padding: 28px 22px 22px; }
        .now .kicker { color: var(--wheat); font-weight: 700; font-size: .92rem; }
        .now .date { font-family: var(--serif); font-weight: 800; font-size: 1.8rem; line-height: 1.3; margin-top: 2px; }
        .now .count { color: rgba(243,241,230,.7); font-size: .9rem; margin-top: 2px; }
        .now .songs { margin-top: 20px; }
        .now .song { border-top: 1px solid rgba(243,241,230,.18); }
        .now .song::before { color: var(--wheat); }
        .now .song-title { font-size: 1.35rem; }
        .now .song-key { background: var(--wheat); color: #14231D; }
        .now .song-comment, .now .transition-note { color: rgba(243,241,230,.78); }
        .now .act { border-color: rgba(243,241,230,.35); color: var(--on-ink); }
        .now .act:hover { background: rgba(255,255,255,.1); }
        .now .act.sheet { background: var(--wheat); border-color: var(--wheat); color: #14231D; }
        .now .act.sheet:hover { background: #d3a043; }
        .now .expand-btn { border-color: rgba(243,241,230,.35); color: var(--on-ink); }
        .now .expand-btn:hover { background: rgba(255,255,255,.08); }
        .now .thumb-card { background: var(--sheet); color: var(--text); }

        /* ---------- 곡 목록 (공통) ---------- */
        .songs { counter-reset: n; }
        .song {
            counter-increment: n; position: relative; padding: 16px 0 16px 2.1rem;
            border-top: 1px solid var(--line);
        }
        .song::before {
            content: counter(n); position: absolute; left: 0; top: 16px; width: 1.6rem;
            font-family: var(--serif); font-weight: 800; font-size: 1.1rem; color: var(--wheat-text); line-height: 1.5;
        }
        .song-main { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; }
        .song-title { font-family: var(--serif); font-weight: 800; font-size: 1.2rem; line-height: 1.45; letter-spacing: -0.02em; }
        .song-key { padding: 1px 10px; border-radius: 99px; background: var(--wheat-wash); color: var(--wheat-text); font-size: .82rem; font-weight: 800; line-height: 1.7; }
        .song-comment { margin-top: 6px; font-size: .92rem; color: var(--muted); }
        .transition-note { margin-top: 6px; font-size: .88rem; color: var(--wheat-text); font-weight: 600; }
        .song-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .act {
            display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
            border-radius: 12px; border: 1px solid var(--line); background: transparent;
            font-size: .9rem; font-weight: 700; transition: background .2s, border-color .2s;
        }
        .act:hover { border-color: var(--ink-soft); }
        .act:active { transform: scale(.97); }
        .act.sheet { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
        .act.sheet:hover { background: var(--ink-soft); }

        .expand-btn {
            width: 100%; min-height: 48px; margin-top: 8px; border-radius: 12px; border: 1px solid var(--line);
            font-weight: 700; font-size: .92rem; transition: background .2s;
        }
        .expand-btn:hover { background: rgba(18,58,47,.05); }
        .expand-area { display: none; margin-top: 12px; gap: 14px; }
        .thumb-card { background: var(--paper); border-radius: 14px; padding: 12px; margin-top: 12px; }
        .thumb-title { font-weight: 700; font-size: .95rem; margin-bottom: 8px; }
        .sheet-thumb { width: 100%; height: auto; border-radius: 8px; background: #fff; cursor: zoom-in; display: block; }

        /* ---------- 지난 찬양 ---------- */
        .past { margin-top: 40px; }
        .past > h2 { font-family: var(--serif); font-weight: 800; font-size: 1.4rem; color: var(--ink); margin-bottom: 14px; }
        .month { border-top: 2px solid var(--ink); }
        .month + .month { margin-top: 10px; }
        .month > summary, .wk > summary { list-style: none; cursor: pointer; }
        .month > summary::-webkit-details-marker, .wk > summary::-webkit-details-marker { display: none; }
        .month > summary { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-height: 56px; padding: 14px 4px; }
        .month > summary .m-name { font-family: var(--serif); font-weight: 800; font-size: 1.2rem; }
        .month > summary .m-count { font-size: .88rem; color: var(--muted); }
        .month > summary::after, .wk > summary::after {
            content: ""; width: 9px; height: 9px; flex-shrink: 0; align-self: center; margin-left: 4px;
            border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s;
        }
        .month[open] > summary::after, .wk[open] > summary::after { transform: rotate(-135deg); }
        .month > summary .m-count { margin-left: auto; }

        .wk { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
        .wk > summary { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 64px; }
        .wk > summary .wk-text { flex: 1; min-width: 0; }
        .wk > summary .wk-date { display: block; font-weight: 800; }
        .wk > summary .wk-songs { display: block; margin-top: 1px; font-size: .88rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .wk-body { padding: 0 16px 16px; }
        .wk-body .song:first-child { border-top: 1px solid var(--line); }

        footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }

        /* ---------- 악보 확대 ---------- */
        #sheetModal {
            display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(8,24,19,.94);
            flex-direction: column; align-items: center; justify-content: center; padding: 16px; overflow: auto;

        .close-overlay {
            position: fixed; top: 14px; right: 14px; z-index: 3001; min-height: 44px; padding: 0 18px;
            display: inline-flex; align-items: center; border-radius: 99px; background: rgba(255,255,255,.16);
            color: #fff; font-weight: 700; font-size: .92rem;

        .close-overlay:hover { background: rgba(255,255,255,.28); }
        #modalCaption { margin-top: 14px; color: #fff; font-family: var(--serif); font-weight: 600; font-size: 1.05rem; text-align: center; }

        /* ---------- 곡 보관함 ---------- */
        #libraryModal { display: none; position: fixed; inset: 0; z-index: 2000; background: var(--paper); overflow-y: auto; padding: 24px 0 48px; }
        .library-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 2px solid var(--ink); }
        .library-header h2 { font-family: var(--serif); font-weight: 800; font-size: 1.5rem; line-height: 1.4; }
        .library-header p { color: var(--muted); font-size: .9rem; margin-top: 2px; }
        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .library-card {
            min-height: 72px; padding: 14px 12px; display: flex; align-items: center; justify-content: center; text-align: center;
            background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
            font-family: var(--serif); font-weight: 800; font-size: .95rem; line-height: 1.45; transition: border-color .2s, background .2s;
        }
        .library-card:hover { border-color: var(--wheat); background: var(--wheat-wash); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; }
        }
    </style>
</head>

        <button type="button" class="btn" onclick="openLibrary()">곡 보관함</button>
    </div>

    <div id="setlist-container"></div>

    <footer>예배 후 악보는 곡 보관함에서 가나다순으로도 찾을 수 있어요.</footer>

</div>

    // 이미지 .jpg / .JPG 및 대체 파일명 자동 변환 로직
    function handleImgFallback(img) {
        const retried = img.getAttribute('data-retried') || '';
        if (retried === '') {
            img.setAttribute('data-retried', 'case');
            if (img.src.includes('.jpg')) {
                img.src = img.src.replace('.jpg', '.JPG');
            } else if (img.src.includes('.JPG')) {
                img.src = img.src.replace('.JPG', '.jpg');
            }
        } else if (retried === 'case' && img.hasAttribute('data-alt')) {
            img.setAttribute('data-retried', 'alt');
            img.src = img.getAttribute('data-alt');
        } else if (retried === 'alt') {
            img.setAttribute('data-retried', 'done');
            if (img.src.includes('.jpg')) {
                img.src = img.src.replace('.jpg', '.JPG');
            } else if (img.src.includes('.JPG')) {
                img.src = img.src.replace('.JPG', '.jpg');
            }
        }
    }

    // 라이브러리 목록 생성을 위한 매핑 로직
    const globalSheetMap = {};
    setlists.forEach(set => set.songs.forEach(s => {
        if (s.sheets) {
            s.sheets.forEach(sh => {
                const titleKey = `${s.title} (${sh.label})`;
                if (!globalSheetMap[titleKey]) globalSheetMap[titleKey] = sh.path;
            });
        } else if (s.sheet && !globalSheetMap[s.title]) {
            globalSheetMap[s.title] = s.sheet;
        }
    }));


    function sheetButtons(s) {
        if (s.sheets) {
            return s.sheets.map(sh =>
                `<button type="button" class="act sheet" onclick="openSheet('${sh.path}', '${s.title} (${sh.label} Key)')">악보 ${sh.label}</button>`
            ).join('');
        }
        const sheetPath = s.sheet || globalSheetMap[s.title];
        if (!sheetPath) return '';
        return `<button type="button" class="act sheet" onclick="openSheet('${sheetPath}', '${s.title}', '${s.altSheet || ''}')">악보</button>`;
    }

    function songListHtml(set) {
        return `<ol class="songs">${set.songs.map(s => `
            <li class="song">
                <div class="song-main">
                    <span class="song-title">${s.title}</span>
                    <span class="song-key">${s.key}</span>
                </div>
                ${s.comment ? `<p class="song-comment">${s.comment}</p>` : ''}
                ${s.transition ? `<p class="transition-note">${s.transition}</p>` : ''}
                <div class="song-acts">
                    <a class="act" href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.title + ' 찬양')}" target="_blank" rel="noopener">유튜브에서 듣기</a>
                    ${sheetButtons(s)}
                </div>
            </li>`).join('')}</ol>`;
    }

    function thumbsHtml(set, idx) {
        const hasSheets = set.songs.some(s => s.sheet || s.sheets || globalSheetMap[s.title]);
        if (!hasSheets) return '';
        return `
            <button type="button" class="expand-btn" onclick="toggleExpand(${idx}, this)">악보를 이미지로 펼쳐보기</button>
            <div id="expand-${idx}" class="expand-area">
                ${set.songs.map(s => {
                    if (s.sheets) {
                        return s.sheets.map(sh =>
                            `<div class="thumb-card">
                                <p class="thumb-title">${s.title} (${sh.label} Key)</p>
                                <img src="${sh.path}" alt="${s.title} 악보" class="sheet-thumb" onerror="handleImgFallback(this)" onclick="openSheet(this.src, '${s.title} (${sh.label} Key)')">
                             </div>`
                        ).join('');
                    }
                    const path = s.sheet || globalSheetMap[s.title];
                    const altAttr = s.altSheet ? `data-alt="${s.altSheet}"` : '';
                    return path ?
                        `<div class="thumb-card">
                            <p class="thumb-title">${s.title}</p>
                            <img src="${path}" ${altAttr} alt="${s.title} 악보" class="sheet-thumb" onerror="handleImgFallback(this)" onclick="openSheet(this.src, '${s.title}')">
                         </div>` : '';
                }).join('')}
            </div>`;
    }

    function weekHtml(set, fullDate, open) {
        const idx = setlists.indexOf(set);
        const label = fullDate ? set.date : set.date.replace(/^\d+년\s*\d+월\s*/, '');
        return `
        <details class="wk" ${open ? 'open' : ''}>
            <summary>
                <span class="wk-text">
                    <span class="wk-date">${label}</span>
                    <span class="wk-songs">${set.songs.map(s => s.title).join(', ')}</span>
                </span>
            </summary>
            <div class="wk-body">
                ${songListHtml(set)}
                ${thumbsHtml(set, idx)}
            </div>
        </details>`;
    }

    function renderSetlists(data, isSearch) {
        const container = document.getElementById('setlist-container');

        if (isSearch) {
            if (data.length === 0) {
                container.innerHTML = `<div class="empty">검색 결과가 없어요. 곡명이나 날짜를 다시 확인해 보세요.</div>`;
                return;
            }
            container.innerHTML = `<p class="result-note">${data.length}개 주일을 찾았어요.</p>` +
                data.map(set => weekHtml(set, true, data.length <= 3)).join('');
            return;
        }

        const [current, ...rest] = data;
        const idx = setlists.indexOf(current);

        const nowHtml = `
        <section class="now" aria-label="이번 주 찬양">
            <p class="kicker">이번 주 찬양</p>
            <h2 class="date">${current.date}</h2>
            <p class="count">총 ${current.songs.length}곡</p>
            <div>
                ${songListHtml(current)}
                ${thumbsHtml(current, idx)}
            </div>
        </section>`;

        // 월별로 묶기 (원본 순서 유지)
        const months = new Map();
        rest.forEach(set => {
            const m = set.date.match(/^(\d+)년\s*(\d+)월/);
            const key = m ? `${m[1]}년 ${m[2]}월` : '기타';
            if (!months.has(key)) months.set(key, []);
            months.get(key).push(set);
        });
        let first = true;
        const pastHtml = `
        <section class="past">
            <h2>지난 찬양</h2>
            ${[...months.entries()].map(([name, sets]) => {
                const open = first; first = false;
                return `
                <details class="month" ${open ? 'open' : ''}>
                    <summary><span class="m-name">${name}</span><span class="m-count">${sets.length}주</span></summary>
                    ${sets.map(set => weekHtml(set, false, false)).join('')}
                </details>`;
            }).join('')}
        </section>`;

        container.innerHTML = nowHtml + pastHtml;
    }

    function toggleExpand(idx, btnEl) {
        const el = document.getElementById(`expand-${idx}`);
        const isShow = el.style.display === 'block';
        el.style.display = isShow ? 'none' : 'block';
        btnEl.innerText = isShow ? '악보를 이미지로 펼쳐보기' : '악보 접기';
    }

    function openSheet(path, title, altPath = '') {
        const modalImg = document.getElementById('modalImg');
        modalImg.removeAttribute('data-retried');
        if (altPath) {
            modalImg.setAttribute('data-alt', altPath);
        } else {
            modalImg.removeAttribute('data-alt');
        }
        modalImg.src = path;
        modalImg.alt = title + ' 악보';
        document.getElementById('modalCaption').innerText = title;
        document.getElementById('sheetModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeSheet() {
        document.getElementById('sheetModal').style.display = 'none';
        // 보관함이 열려 있으면 스크롤 잠금 유지
        document.body.style.overflow = document.getElementById('libraryModal').style.display === 'block' ? 'hidden' : 'auto';
    }

    function openLibrary() {
        const grid = document.getElementById('libraryGrid');
        grid.innerHTML = Object.keys(globalSheetMap).sort().map(title => `
            <div class="library-card" role="button" tabindex="0" onclick="openSheet('${globalSheetMap[title]}', '${title}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">${title}</div>
        `).join('');
        document.getElementById('libraryModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeLibrary() {
        document.getElementById('libraryModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function filterSetlists() {
        const q = document.getElementById('searchInput').value.toLowerCase().replace(/\s/g, '');
        if (q === '') { renderSetlists(setlists, false); return; }
        renderSetlists(setlists.filter(s => s.date.toLowerCase().replace(/\s/g, '').includes(q) || s.songs.some(song => song.title.toLowerCase().includes(q))), true);
    }

    document.getElementById('modalImg').onerror = function () { handleImgFallback(this); };

    renderSetlists(setlists, false);
</script>

</body>
</html>
