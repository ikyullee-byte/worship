<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원종제일교회 찬양 아카이브</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg-main: #f4f6fb;
            --bg-card: #ffffff;
            --bg-subtle: #f8fafc;
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --primary-hover: #4338ca;
            --text-dark: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --alert-bg: #fff1f2;
            --alert-text: #e11d48;
            --alert-border: #ffe4e6;
            --shadow-sm: 0 2px 8px -2px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 12px 32px -4px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 20px 40px -8px rgba(79, 70, 229, 0.12);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.07) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(56, 189, 248, 0.07) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-dark);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* 헤더 영역 */
        header {
            padding: 4.5rem 1.5rem 2.5rem;
            text-align: center;
            max-width: 820px;
            margin: 0 auto;
        }

        .church-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 100px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            margin: 0;
            color: var(--text-dark);
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 0 1.25rem 6rem;
        }

        /* 공지사항 배너 */
        .announcement {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: #ffffff;
            padding: 1rem 1.4rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 상단 고정(Sticky) 컨트롤 바 */
        .controls-wrapper {
            position: sticky;
            top: 16px;
            z-index: 100;
            margin-bottom: 2.5rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
        }

        .search-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .search-box {
            width: 100%;
            background: transparent;
            border: none;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border-radius: 14px;
            color: var(--text-dark);
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box::placeholder { color: #94a3b8; }
        .search-box:focus { background: var(--bg-subtle); }

        .btn {
            background: var(--text-dark);
            color: white;
            padding: 0 1.4rem;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--primary);
            transform: translateY(-1px);
        }

        /* 콘티 카드 스타일 */
        .setlist-item {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 1.75rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .setlist-item.latest {
            border: 2px solid var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .date-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-label {
            font-size: 1.25rem;
            color: var(--text-dark);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .latest-badge {
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 100px;
        }

        .song-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* 개별 곡(Track) 리스트 */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .song-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background: var(--bg-subtle);
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .song-row:hover {
            background: #ffffff;
            border-color: var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .song-left {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            flex: 1;
            padding-right: 12px;
        }

        .track-num {
            background: #e2e8f0;
            color: #475569;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 800;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .latest .track-num {
            background: var(--primary-light);
            color: var(--primary);
        }

        .song-info { flex: 1; }

        .song-main {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .song-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.01em;
        }

        .song-key {
            background: #ffffff;
            color: var(--primary);
            border: 1px solid #c7d2fe;
            padding: 2px 9px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .song-comment {
            font-size: 0.88rem;
            color: var(--text-body);
            margin-top: 6px;
            font-weight: 500;
            background: #ffffff;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: inline-block;
        }

        .transition-note {
            display: inline-block;
            margin-top: 6px;
            background-color: var(--alert-bg);
            color: var(--alert-text);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            border: 1px solid var(--alert-border);
        }

        /* 우측 액션 버튼들 */
        .action-btns {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-body);
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.15s ease;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .icon-btn.yt-btn { color: #ef4444; }
        .icon-btn.yt-btn:hover { background: #fef2f2; border-color: #fecaca; }

        .icon-btn.sheet-btn:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* 악보 펼치기 영역 */
        .expand-btn {
            width: 100%;
            margin-top: 1.25rem;
            padding: 0.9rem;
            background: var(--bg-subtle);
            color: var(--text-body);
            border: 1px dashed #cbd5e1;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .expand-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
            border-color: #a5b4fc;
        }

        .expand-area {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .thumb-card {
            background: var(--bg-subtle);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.25rem;
            border: 1px solid var(--border-color);
        }

        .thumb-title {
            font-weight: 800;
            font-size: 0.95rem;
            margin: 0 0 10px 0;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sheet-thumb {
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            display: block;
            transition: transform 0.2s ease;
        }

        /* 모달창 (다크 글래스 스타일) */
        #sheetModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 1rem;
        }

        #modalImg {
            max-width: 95%;
            max-height: 82vh;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background: #ffffff;
        }

        .close-overlay {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 100px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .close-overlay:hover { background: rgba(255, 255, 255, 0.3); }

        #modalCaption {
            margin-top: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
        }

        /* 전체 악보 보관함 모달 */
        #libraryModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main);
            z-index: 5000;
            padding: 3rem 1.25rem;
            overflow-y: auto;
        }

        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }

        .library-card {
            background: var(--bg-card);
            padding: 1.5rem 1rem;
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .library-card:hover { 
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        @media (max-width: 600px) {
            header { padding: 3rem 1rem 2rem; }
            header h1 { font-size: 2rem; }
            .setlist-item { padding: 1.5rem 1.2rem; }
            .song-row { padding: 0.9rem; }
            .song-title { font-size: 1.05rem; }
            .btn span.btn-text { display: none; }
            .btn { padding: 0 1rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="church-badge">⛪ 원종제일교회 찬양팀</div>
    <h1>찬양 아카이브</h1>
</header>

<div class="container">
    <div class="announcement">
        <span>📢</span>
        <span>예배 후 보면대를 꼭 정리해주시기 바랍니다.</span>
    </div>

    <div class="controls-wrapper">
        <div class="controls">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-box" placeholder="곡명 또는 날짜로 빠르게 검색..." onkeyup="filterSetlists()">
            </div>
            <button class="btn" onclick="openLibrary()">
                <span>📚</span>
                <span class="btn-text">곡 보관함</span>
            </button>
        </div>
    </div>

    <div id="setlist-container"></div>
</div>

<!-- 악보 확대 모달 -->
<div id="sheetModal" onclick="closeSheet()">
    <div class="close-overlay">닫기 ✕</div>
    <img id="modalImg" src="" onerror="handleImgFallback(this)">
    <div id="modalCaption"></div>
</div>

<!-- 전체 악보 보관함 모달 -->
<div id="libraryModal">
    <div class="container" style="padding-top: 0;">
        <div class="library-header">
            <div>
                <h2 style="font-size: 1.8rem; font-weight: 900; margin:0;">전체 악보 보관함</h2>
                <p style="color: var(--text-muted); margin: 4px 0 0 0; font-size: 0.9rem;">등록된 모든 악보를 가나다순으로 모아봅니다.</p>
            </div>
            <button class="btn" onclick="closeLibrary()">닫기 ✕</button>
        </div>
        <div id="libraryGrid" class="library-grid"></div>
    </div>
</div>

<script>
    // 💡 이미지 .jpg / .JPG 및 대체 파일명 자동 변환 로직
    function handleImgFallback(img) {
        const retried = img.getAttribute('data-retried') || '';
        if (retried === '') {
            img.setAttribute('data-retried', 'case');
            if (img.src.includes('.jpg')) {
                img.src = img.src.replace('.jpg', '.JPG');
            } else if (img.src.includes('.JPG')) {
                img.src = img.src.replace('.JPG', '.jpg');
            }
        } else if (retried === 'case' && img.hasAttribute('data-alt')) {
            img.setAttribute('data-retried', 'alt');
            img.src = img.getAttribute('data-alt');
        } else if (retried === 'alt') {
            img.setAttribute('data-retried', 'done');
            if (img.src.includes('.jpg')) {
                img.src = img.src.replace('.jpg', '.JPG');
            } else if (img.src.includes('.JPG')) {
                img.src = img.src.replace('.JPG', '.jpg');
            }
        }
    }

        }

                if (s.sheets) {

                    ).join('');
                } else {
                    const sheetPath = s.sheet || globalSheetMap[s.title];

                        sheetBtns = `<div onclick="openSheet('${sheetPath}', '${s.title}', '${altPath}')" class="icon-btn sheet-btn" title="악보 보기">🎼 악보</div>`;
                    }
                }

                return `
                <div class="song-row">
                    <div class="song-left">
                        <div class="track-num">${songIdx + 1}</div>
                        <div class="song-info">
                            <div class="song-main">

                                <span class="song-key">${s.key}</span>
                            </div>
                            ${s.comment ? `<div class="song-comment">${s.comment}</div>` : ''}
                            ${s.transition ? `<div class="transition-note">${s.transition}</div>` : ''}
                        </div>
                    </div>
                    <div class="action-btns">
                        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.title + ' 찬양')}" target="_blank" class="icon-btn yt-btn" title="유튜브 검색">▶</a>
                        ${sheetBtns}
                    </div>
                </div>`;
            }).join('');

            return `
            <div class="setlist-item ${isLatest ? 'latest' : ''}">
                <div class="card-header">
                    <div class="date-group">
                        <span class="date-label">${set.date}</span>
                        ${isLatest ? `<span class="latest-badge">✨ 이번 주 찬양</span>` : ''}
                    </div>
                    <span class="song-count">총 ${set.songs.length}곡</span>
                </div>
                <div class="song-list">
                    ${songsHtml}
                </div>
                ${hasSheets ? `<button class="expand-btn" onclick="toggleExpand(${idx}, this)">이미지로 악보 한눈에 펼치기 🖼️</button>` : ''}
                <div id="expand-${idx}" class="expand-area">

                            ).join('');
                        } else {
                            const path = s.sheet || globalSheetMap[s.title];
                            const altAttr = s.altSheet ? `data-alt="${s.altSheet}"` : '';
                            return path ? 
                                `<div class="thumb-card">
                                    <p class="thumb-title">🎼 ${s.title}</p>
                                    <img src="${path}" ${altAttr} class="sheet-thumb" onerror="handleImgFallback(this)" onclick="openSheet(this.src, '${s.title}')">

                        }
                    }).join('')}
                </div>
            </div>`;
        }).join('');
    }

    function toggleExpand(idx, btnEl) {
        const el = document.getElementById(`expand-${idx}`);
        const isShow = el.style.display === 'block';
        el.style.display = isShow ? 'none' : 'block';
        btnEl.innerText = isShow ? '이미지로 악보 한눈에 펼치기 🖼️' : '악보 접기 ▲';
    }

    function openSheet(path, title, altPath = '') {
        const modalImg = document.getElementById('modalImg');
        modalImg.removeAttribute('data-retried');
        if (altPath) {
            modalImg.setAttribute('data-alt', altPath);
        } else {
            modalImg.removeAttribute('data-alt');
        }
        modalImg.src = path;
        document.getElementById('modalCaption').innerText = title;
        document.getElementById('sheetModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeSheet() {
        document.getElementById('sheetModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function openLibrary() {
        const grid = document.getElementById('libraryGrid');
        grid.innerHTML = Object.keys(globalSheetMap).sort().map(title => `
            <div class="library-card" onclick="openSheet('${globalSheetMap[title]}', '${title}')">

                <div style="font-weight: 800; font-size: 0.9rem; color: var(--text-dark); word-break: keep-all;">${title}</div>
            </div>
        `).join('');
        document.getElementById('libraryModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeLibrary() { 
        document.getElementById('libraryModal').style.display = 'none'; 
        document.body.style.overflow = 'auto';
    }

    function filterSetlists() {
        const q = document.getElementById('searchInput').value.toLowerCase().replace(/\s/g, '');
        renderSetlists(setlists.filter(s => s.date.toLowerCase().replace(/\s/g, '').includes(q) || s.songs.some(song => song.title.toLowerCase().includes(q))));
    }
