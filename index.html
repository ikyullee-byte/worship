            --main-border: #e2e8f0;

            --alert-text: #ef4444;
            --alert-border: #fee2e2;
        }

        body { background-color: var(--main-bg); color: var(--main-text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        header { padding: 5rem 2rem 3rem; text-align: center; background: radial-gradient(circle at top, #dbeafe 0%, transparent 70%); }
        header h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.04em; margin: 0; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--main-muted); font-size: 1rem; font-weight: 600; letter-spacing: 0.1em; margin-top: 12px; }
        .container { max-width: 850px; margin: 0 auto; padding: 0 1.5rem 5rem; }
        
        .announcement { background: #ffffff; border-left: 5px solid var(--main-accent); padding: 1.2rem; border-radius: 12px; margin-bottom: 3rem; font-size: 1rem; font-weight: 700; color: var(--main-text); box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 12px; }
        
        .controls { display: flex; gap: 12px; margin-bottom: 3rem; }
        .search-box { flex: 1; background: var(--main-card); border: 2px solid var(--main-border); padding: 1rem 1.5rem; border-radius: 16px; color: var(--main-text); font-size: 1rem; font-weight: 500; outline: none; transition: all 0.2s ease; }
        .search-box:focus { border-color: var(--main-accent); box-shadow: 0 0 0 4px var(--main-accent-soft); }
        .btn { background: var(--main-text); color: white; padding: 0 1.8rem; border-radius: 16px; border: none; cursor: pointer; font-weight: 700; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
        .btn:hover { background: var(--main-accent); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3); }

        .setlist-item { background: var(--main-card); border-radius: 28px; padding: 2.5rem; margin-bottom: 2.5rem; border: 1px solid var(--main-border); box-shadow: 0 10px 30px rgba(0,0,0,0.03); transition: transform 0.3s ease; }
        .date-label { font-size: 0.9rem; color: var(--main-accent); font-weight: 800; margin-bottom: 1.5rem; display: block; }
        
        .song-row { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 0; border-bottom: 1px solid var(--main-border); }
        .song-row:last-child { border-bottom: none; }
        .song-main { display: flex; align-items: center; gap: 12px; }
        .song-title { font-size: 1.25rem; font-weight: 800; color: var(--main-text); }
        .song-key { background: var(--main-accent-soft); color: var(--main-accent); padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 800; }
        
        .song-comment { font-size: 0.9rem; color: var(--main-muted); margin-top: 6px; font-weight: 500; }
        .transition-note { display: inline-block; margin-top: 8px; background-color: var(--alert-bg); color: var(--alert-text); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; border: 1px solid var(--alert-border); }

        .action-btns { display: flex; gap: 10px; }
        .icon-btn { background: #f1f5f9; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 12px; text-decoration: none; color: var(--main-text); font-weight: 700; transition: all 0.2s ease; cursor: pointer; border: none; }
        .icon-btn:hover { background: var(--main-accent); color: white; }

        .expand-area { margin-top: 2rem; padding-top: 2rem; border-top: 2px dashed var(--main-border); display: none; }
        .sheet-thumb { width: 100%; border-radius: 20px; margin-bottom: 2rem; cursor: pointer; border: 1px solid var(--main-border); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* 모달창들 */
        #sheetModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.98); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        #modalImg { max-width: 92%; max-height: 82vh; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .close-overlay { position: absolute; top: 30px; right: 30px; background: var(--main-text); color: white; padding: 12px 24px; border-radius: 100px; cursor: pointer; font-weight: 700; }
        
        #libraryModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--main-bg); z-index: 5000; padding: 5rem 2rem; overflow-y: auto; }
        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .library-card { background: var(--main-card); padding: 2.5rem 1.5rem; border-radius: 24px; text-align: center; border: 1px solid var(--main-border); cursor: pointer; transition: all 0.2s ease; }
        .library-card:hover { border-color: var(--main-accent); transform: translateY(-5px); box-shadow: 0 10px 25px rgba(59, 130, 246, 0.1); }

        { date: "2025년 5월 25일", songs: [{ title: "사랑하는나의아버지", key: "C" }, { title: "난예수가좋다오", key: "A" }, { title: "이땅의황무함을보소서", key: "A" }] },
        { date: "2025년 5월 18일", songs: [{ title: "보혈을지나", key: "G" }, { title: "난예수가좋다오", key: "A" }, { title: "그사랑", key: "G" }] },
        { date: "2023년 12월 8일", songs: [{ title: "축복송", key: "D" }, { title: "주예수내맘에", key: "Ab" }, { title: "부르신곳에서", key: "E" }] }
    ];

    const globalSheetMap = {};
    setlists.forEach(set => set.songs.forEach(s => { if (s.sheet && !globalSheetMap[s.title]) globalSheetMap[s.title] = s.sheet; }));

    function renderSetlists(data) {
        const container = document.getElementById('setlist-container');
        container.innerHTML = data.map((set, idx) => {
            const hasSheets = set.songs.some(s => s.sheet || globalSheetMap[s.title]);
            const songsHtml = set.songs.map((s) => {
                const sheetPath = s.sheet || globalSheetMap[s.title];
                return `
                <div class="song-row">
                    <div style="flex: 1; padding-right: 15px;">
                        <div class="song-main">
                            <span class="song-title">${s.title}</span>
                            <span class="song-key">${s.key}</span>
                        </div>
                        ${s.comment ? `<div class="song-comment">${s.comment}</div>` : ''}
                        ${s.transition ? `<div class="transition-note">${s.transition}</div>` : ''}
                    </div>
                    <div class="action-btns">
                        <a href="https://www.youtube.com/results?search_query=${s.title} 찬양" target="_blank" class="icon-btn" title="유튜브">▶</a>
                        ${sheetPath ? `<div onclick="openSheet('${sheetPath}', '${s.title}')" class="icon-btn" title="악보">🎼</div>` : ''}
                    </div>
                </div>`;
            }).join('');

            return `
            <div class="setlist-item">
                <span class="date-label">${set.date}</span>
                ${songsHtml}
                ${hasSheets ? `<button class="btn" style="width:100%; margin-top:2rem; background: #f1f5f9; color: #475569;" onclick="toggleExpand(${idx})">이미지로 악보 모두 펼치기 🖼️</button>` : ''}
                <div id="expand-${idx}" class="expand-area">
                    ${set.songs.map(s => {
                        const path = s.sheet || globalSheetMap[s.title];
                        // 썸네일 이미지에도 onerror 속성 부여
                        return path ? `<p style="font-weight:700; margin-bottom:10px; color:var(--main-accent);">${s.title}</p><img src="${path}" class="sheet-thumb" onerror="handleImgFallback(this)" onclick="openSheet(this.src, '${s.title}')">` : '';
                    }).join('')}
                </div>
            </div>`;
        }).join('');
    }

    function toggleExpand(idx) {
        const el = document.getElementById(`expand-${idx}`);
        const isShow = el.style.display === 'block';
        el.style.display = isShow ? 'none' : 'block';
        event.target.innerText = isShow ? '이미지로 악보 모두 펼치기 🖼️' : '악보 접기 ❌';
    }

    function openSheet(path, title) {
        const modalImg = document.getElementById('modalImg');
        modalImg.removeAttribute('data-retried'); // 새로운 사진 띄울 때 재시도 기록 초기화
        modalImg.src = path;
        document.getElementById('modalCaption').innerText = title;
        document.getElementById('sheetModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeSheet() {
        document.getElementById('sheetModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function openLibrary() {
        const grid = document.getElementById('libraryGrid');
        grid.innerHTML = Object.keys(globalSheetMap).sort().map(title => `
            <div class="library-card" onclick="openSheet('${globalSheetMap[title]}', '${title}')">
                <div style="font-size: 2.2rem; margin-bottom: 15px;">🎼</div>
                <div style="font-weight: 800; font-size: 1rem;">${title}</div>
            </div>
        `).join('');
        document.getElementById('libraryModal').style.display = 'block';
    }

    function closeLibrary() { document.getElementById('libraryModal').style.display = 'none'; }

    function filterSetlists() {
        const q = document.getElementById('searchInput').value.toLowerCase().replace(/\s/g, '');
        renderSetlists(setlists.filter(s => s.date.toLowerCase().replace(/\s/g, '').includes(q) || s.songs.some(song => song.title.toLowerCase().includes(q))));
    }

    renderSetlists(setlists);
</script>

</body>
</html>
